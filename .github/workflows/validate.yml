name: Isolated validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
      PUBLIC_FIREBASE_API_KEY: synthetic
      PUBLIC_FIREBASE_APP_ID: synthetic
      PUBLIC_FIREBASE_AUTH_DOMAIN: synthetic.invalid
      PUBLIC_FIREBASE_DATABASE_URL: https://synthetic.invalid
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: synthetic
      PUBLIC_FIREBASE_PROJECT_ID: synthetic
      PUBLIC_FIREBASE_STORAGE_BUCKET: synthetic.invalid
      DATABASE_URL: /tmp/rehear-synthetic-frontend.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          BUILD_TARGET: node
        run: |
          npm run build
          test -f build-node/handler.js
          SUSHI_HOST=127.0.0.1 SUSHI_PORT=55173 SUSHI_ORIGIN=http://127.0.0.1:55173 node build-node/index.js > "$RUNNER_TEMP/frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:55173/ -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:55173/odi)" = 308
      - name: Install backend test dependencies and Caddy
        run: |
          python -m pip install -r backend/requirements-evc-dev.txt
          brew install caddy
      - name: Exercise loopback integration
        working-directory: backend
        run: python -m pytest -q -rs tests/test_ingress_contract.py tests/test_startup_recovery.py tests/test_runtime_paths.py tests/test_external_storage.py tests/test_home_deploy.py odi/files/tests odi/db/tests odi/EVC/tests
